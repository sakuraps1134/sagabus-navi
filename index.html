<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>佐賀バスロケ</title>

    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.x/dist/protobuf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
       html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
    font-family:sans-serif;
}

#map{
    position:fixed;
    inset:0;
    z-index:1;
}

#header{
    position:fixed;
    top:10px;
    left:10px;
    z-index:1000;

    background:white;
    padding:8px 12px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);

    font-weight:bold;
}

#status{
    position:fixed;
    bottom:10px;
    left:10px;
    z-index:1000;

    background:white;
    padding:8px 12px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,.2);

    font-size:14px;
}

.scrollable-table{
    max-height:300px;
    overflow-y:auto;
}

table{
    width:100%;
    border-collapse:collapse;
    font-size:14px;
}

th,
td{
    border:1px solid #eee;
    padding:4px;
}

.leaflet-popup-content{
    width:min(350px,85vw) !important;
}
    </style>
</head>
<body>

<div id="map"></div>

<div id="header">
    佐賀バスロケ（系統1番）
</div>

<div id="status">
    読み込み中...
</div>

<script>

const PROTO_PATH = '/gtfs-realtime.proto';

const FEED_URL =
    'https://sagabus-proxy.sakuraps1134.workers.dev/';

const VEHICLE_CSV =
    'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/vehicle.csv';

const STOPS_CSV =
    'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/stops.txt';

const TRIP_SCHEDULES_JSON =
    'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/trip_schedules.json';


// ------------------
// グローバル変数
// ------------------

let vehicleMap = {};
let stopsMap = {};
let tripSchedules = {};
let markers = [];
let positionHistory = {};
let historyCircles = [];


// ------------------
// 地図
// ------------------

const map = L.map('map').setView([33.2635, 130.3016], 13);
setTimeout(() => {
    map.invalidateSize();
}, 100);

L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
        attribution: '© OpenStreetMap'
    }
).addTo(map);


// ------------------
// CSV読込
// ------------------

async function fetchShiftJisCsv(url) {

    const response = await fetch(url);

    const buffer = await response.arrayBuffer();

    const decoder = new TextDecoder('shift-jis');

    return decoder.decode(buffer);
}

async function fetchUtf8Text(url) {

    const response = await fetch(url);

    return await response.text();
}


// ------------------
// 初期化
// ------------------

async function initData() {

    //
    // vehicle.csv
    //

    const csvVehicle =
        await fetchShiftJisCsv(VEHICLE_CSV);

    await new Promise(resolve => {

        Papa.parse(csvVehicle, {

            complete: (r) => {

                r.data.forEach(row => {

                    if (row.length >= 2) {

                        vehicleMap[
                            row[0]
                                .trim()
                                .replace(/^0+/, '')
                        ] = row[1];
                    }
                });

                resolve();
            }
        });
    });

    console.log(
        'vehicle loaded',
        Object.keys(vehicleMap).length
    );


    //
    // stops.txt
    //

    const csvStops =
        await fetchUtf8Text(STOPS_CSV);

    await new Promise(resolve => {

        Papa.parse(csvStops, {

            header: true,

            complete: (r) => {

                console.log(
                    'stops sample',
                    r.data[0]
                );

                r.data.forEach(row => {

                    const stopId =
                        row.stop_id ||
                        row['﻿stop_id'];

                    const stopName =
                        row.stop_name;

                    if (stopId && stopName) {

                        stopsMap[
                            stopId.trim()
                        ] = stopName.trim();
                    }
                });

                resolve();
            }
        });
    });

    console.log(
        'stops loaded',
        Object.keys(stopsMap).length
    );

    console.log(
        '1001002-01 =>',
        stopsMap['1001002-01']
    );


    //
    // trip_schedules.json
    //

    tripSchedules =
        await fetch(TRIP_SCHEDULES_JSON)
            .then(r => r.json());

    console.log(
        'tripSchedules loaded',
        Object.keys(tripSchedules).length
    );
}


// ------------------
// バス位置更新
// ------------------

async function loadBusData() {

    try {

        const root =
            await protobuf.load(PROTO_PATH);

        const buffer =
            await (
                await fetch(FEED_URL)
            ).arrayBuffer();

        const message =
            root
                .lookupType(
                    'transit_realtime.FeedMessage'
                )
                .decode(
                    new Uint8Array(buffer)
                );

        markers.forEach(m =>
            map.removeLayer(m)
        );

        markers = [];
        historyCircles.forEach(c =>
    map.removeLayer(c)
);

historyCircles = [];

        message.entity.forEach(item => {

            if (
                item.vehicle?.trip &&
                item.vehicle.trip.tripId.startsWith('1')
            ) {

                const tripId =
                    item.vehicle.trip.tripId;

                const rawId =
                    item.vehicle.vehicle.id
                        .replace(/^0+/, '');

                const {
                    latitude,
                    longitude
                } = item.vehicle.position;

                if (!positionHistory[tripId]) {
    positionHistory[tripId] = [];
}

positionHistory[tripId].push({
    lat: latitude,
    lng: longitude
});

if (positionHistory[tripId].length > 3) {
    positionHistory[tripId].shift();
}
const history =
    positionHistory[tripId];
    if (history.length >= 2) {

    const prev =
        history[history.length - 2];

    const circle1 = L.circle(
        [prev.lat, prev.lng],
        {
            radius: 30,
            color: '#55cfff',
            weight: 2,
            fillColor: '#bdefff',
            fillOpacity: 0.35
        }
    ).addTo(map);

    historyCircles.push(circle1);
}
if (history.length >= 3) {

    const prev2 =
        history[history.length - 3];

    const circle2 = L.circle(
        [prev2.lat, prev2.lng],
        {
            radius: 15,
            color: '#55cfff',
            weight: 2,
            fillColor: '#d8f6ff',
            fillOpacity: 0.25
        }
    ).addTo(map);

    historyCircles.push(circle2);
}

                const busLabel =
                    vehicleMap[rawId] ||
                    `車両ID:${rawId}`;

                const rows =
                    (tripSchedules[tripId] || [])
                    .map(s => {

                        const stopName =
                            stopsMap[s.stop_id] ||
                            s.stop_id;

                        return `
                            <tr>
                                <td>${(s.time || '').slice(0,5)}</td>
                                <td>${stopName}</td>
                            </tr>
                        `;
                    })
                    .join('');

                const marker =
                    L.marker([
                        latitude,
                        longitude
                    ]).addTo(map);

                marker.bindPopup(`
                    <b>${busLabel}</b>

                    <div class="scrollable-table">

                        <table>

                            <thead>
                                <tr>
                                    <th>時刻</th>
                                    <th>停留所</th>
                                </tr>
                            </thead>

                            <tbody>
                                ${rows}
                            </tbody>

                        </table>

                    </div>
                `);

                markers.push(marker);
            }
        });

        document.getElementById(
            'status'
        ).textContent =
            '最終更新時刻: ' +
            new Date().toLocaleTimeString();

    } catch (err) {

        console.error(err);
    }
}


// ------------------
// 開始
// ------------------

initData().then(() => {

    loadBusData();

    setInterval(
        loadBusData,
        10000
    );
});

</script>

</body>
</html>

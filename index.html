<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>佐賀バスロケ - 運行表連携</title>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.x/dist/protobuf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <h1>バスの位置情報</h1>
    <div id="map" style="height: 600px; width: 100%;"></div>

    <script>
        const PROTO_PATH = '/gtfs-realtime.proto';
        const FEED_URL = 'https://sagabus-proxy.sakuraps1134.workers.dev/';
        const VEHICLE_CSV = 'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/vehicle.csv';
        const STOPS_CSV = 'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/stops.txt';
        const STOP_TIMES_CSV = 'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/stop_times.txt';

        let map = L.map('map').setView([33.2635, 130.3016], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        let vehicleMap = {}, stopsMap = {}, tripSchedules = {};
        let markers = [];

        // 全データ読み込み
        async function initData() {
            // 1. 車両名読み込み
            const resV = await fetch(VEHICLE_CSV);
            Papa.parse(await resV.text(), { complete: (r) => r.data.forEach(row => vehicleMap[row[0].trim().replace(/^0+/, '')] = row[1]) });

            // 2. 停留所詳細読み込み (ID -> Name)
            const resS = await fetch(STOPS_CSV);
            Papa.parse(await resS.text(), { header: true, complete: (r) => r.data.forEach(row => stopsMap[row.stop_id] = row.stop_name) });

            // 3. 時刻表読み込み (TripID -> [Time, StopID])
            const resT = await fetch(STOP_TIMES_CSV);
            Papa.parse(await resT.text(), { header: true, complete: (r) => {
                r.data.forEach(row => {
                    if (!tripSchedules[row.trip_id]) tripSchedules[row.trip_id] = [];
                    tripSchedules[row.trip_id].push({ time: row.arrival_time, name: stopsMap[row.stop_id] || row.stop_id });
                });
            }});
        }

        async function loadBusData() {
            try {
                const root = await protobuf.load(PROTO_PATH);
                const FeedMessage = root.lookupType("transit_realtime.FeedMessage");
                const res = await fetch(FEED_URL);
                const message = FeedMessage.decode(new Uint8Array(await res.arrayBuffer()));

                markers.forEach(m => map.removeLayer(m));
                markers = [];

                message.entity.forEach(item => {
                    if (item.vehicle?.trip) {
                        const { latitude, longitude } = item.vehicle.position;
                        const tripId = item.vehicle.trip.tripId;
                        const rawId = item.vehicle.vehicle.id.replace(/^0+/, '');
                        
                        // 時刻表データの生成
                        const schedule = tripSchedules[tripId] || [];
                        const scheduleHtml = schedule.map(s => `<li>${s.time.slice(0,5)} : ${s.name}</li>`).join('');

                        const marker = L.marker([latitude, longitude]).addTo(map);
                        marker.bindPopup(`
                            <b>${vehicleMap[rawId] || "不明車両"}</b><br>
                            <small>Trip: ${tripId}</small><br>
                            <ul style="padding-left:15px; margin:5px 0;">${scheduleHtml}</ul>
                        `);
                        markers.push(marker);
                    }
                });
            } catch (err) { console.error(err); }
        }

        initData().then(() => {
            loadBusData();
            setInterval(loadBusData, 10000);
        });
    </script>
</body>
</html>

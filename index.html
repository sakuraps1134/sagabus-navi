<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>佐賀バスロケ</title>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.x/dist/protobuf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .scrollable-table { max-height: 200px; overflow-y: auto; border: 1px solid #ccc; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; }
        th, td { border: 1px solid #eee; padding: 4px; text-align: left; }
    </style>
</head>
<body>
    <h1>佐賀バスロケ状況（系統1番のみ）</h1>
    <div id="map" style="height: 500px; width: 100%;"></div>
    <div id="status" style="margin-top:10px; font-weight:bold;">読み込み中...</div>

    <script>
        const PROTO_PATH = '/gtfs-realtime.proto';
        const FEED_URL = 'https://sagabus-proxy.sakuraps1134.workers.dev/';
        const VEHICLE_CSV = 'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/vehicle.csv';

        async function initData() {

    // vehicle.csv
    const csvVehicle = await fetchShiftJisCsv(VEHICLE_CSV);

    Papa.parse(csvVehicle, {
        complete: (r) => {
            r.data.forEach(row => {
                if (row.length >= 2) {
                    vehicleMap[row[0].trim().replace(/^0+/, '')] = row[1];
                }
            });
        }
    });

    // stops.txt
    const csvStops = await fetchShiftJisCsv(STOPS_CSV);

 Papa.parse(csvStops, {
    header: true,
    complete: (r) => {
        r.data.forEach(row => {

            if (row.stop_id && row.stop_name) {
                stopsMap[row.stop_id.trim()] =
                    row.stop_name.trim();
            }
        });
    }
});

    // trip_schedules.json
    tripSchedules = await fetch(TRIP_SCHEDULES_JSON)
        .then(r => r.json());

    console.log(
        "tripSchedules loaded:",
        Object.keys(tripSchedules).length
    );
}
        const STOPS_CSV = 'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/stops.txt';
        
        const TRIP_SCHEDULES_JSON = 'https://raw.githubusercontent.com/sakuraps1134/sagabus-navi/main/trip_schedules.json';

        let map = L.map('map').setView([33.2635, 130.3016], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);

        let vehicleMap = {};
let stopsMap = {};
let tripSchedules = {};
let markers = [];

        async function fetchShiftJisCsv(url) {
            const response = await fetch(url);
            const buffer = await response.arrayBuffer();
            const decoder = new TextDecoder('shift-jis');
            return decoder.decode(buffer);
        }

       async function initData() {

    // vehicle.csv
    const csvVehicle = await fetchShiftJisCsv(VEHICLE_CSV);

    Papa.parse(csvVehicle, {
        complete: (r) => {
            r.data.forEach(row => {
                if (row.length >= 2) {
                    vehicleMap[row[0].trim().replace(/^0+/, '')] = row[1];
                }
            });
        }
    });

    // trip_schedules.json
    tripSchedules = await fetch(TRIP_SCHEDULES_JSON)
        .then(r => r.json());

    console.log(
        "tripSchedules loaded:",
        Object.keys(tripSchedules).length
    );
}

        async function loadBusData() {
            try {
                const root = await protobuf.load(PROTO_PATH);
                const message = root.lookupType("transit_realtime.FeedMessage").decode(new Uint8Array(await (await fetch(FEED_URL)).arrayBuffer()));

                markers.forEach(m => map.removeLayer(m));
                markers = [];

                message.entity.forEach(item => {
                    // trip_id が 1 から始まるもののみ抽出
                    if (item.vehicle?.trip && item.vehicle.trip.tripId.startsWith("1")) {
                        const { latitude, longitude } = item.vehicle.position;
                        const tripId = item.vehicle.trip.tripId;
                        const rawId = item.vehicle.vehicle.id.replace(/^0+/, '');
                        
                        const busLabel = vehicleMap[rawId] ? vehicleMap[rawId] : `車両ID: ${rawId}`;
                        
                       const rows = (tripSchedules[tripId] || []).map(s => {

    const stopName =
        stopsMap[s.stop_id] ||
        s.stop_id;

    return `
        <tr>
            <td>${(s.time || '').slice(0,5)}</td>
            <td>${stopName}</td>
        </tr>
    `;
}).join('');
                        
                        const marker = L.marker([latitude, longitude]).addTo(map);
                        marker.bindPopup(`
                            <b>${busLabel}</b>
                            <div class="scrollable-table">
                                <table><thead><tr><th>時刻</th><th>停留所</th></tr></thead><tbody>${rows}</tbody></table>
                            </div>
                        `);
                        markers.push(marker);
                    }
                });
                document.getElementById('status').textContent = "最終更新時刻: " + new Date().toLocaleTimeString();
            } catch (err) { console.error(err); }
        }

        initData().then(() => {
            loadBusData();
            setInterval(loadBusData, 10000);
        });
    </script>
</body>
</html>

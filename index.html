<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>バスロケ確認</title>
    <script src="https://cdn.jsdelivr.net/npm/protobufjs@7.x/dist/protobuf.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <h1>バスの位置情報</h1>
    <div id="map" style="height: 500px; width: 100%;"></div>
    <pre id="output">読み込み中...</pre>

    <script>
        const root = await protobuf.load('/gtfs-realtime.proto');
        const FEED_URL = 'https://sagabus-proxy.sakuraps1134.workers.dev';

        // 1. 地図を先に初期化
        const map = L.map('map').setView([33.2635, 130.3016], 12); 
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        async function loadBusData() {
            try {
                const root = await protobuf.load(PROTO_PATH);
                const FeedMessage = root.lookupType("transit_realtime.FeedMessage");

                const response = await fetch(FEED_URL);
                if (!response.ok) throw new Error('データ取得失敗: ' + response.status);
                
                const buffer = await response.arrayBuffer();
                const message = FeedMessage.decode(new Uint8Array(buffer));
                
                // データの内容を表示
                document.getElementById('output').textContent = "バスの台数: " + message.entity.length;

                // 2. 成功時にマーカーをプロット
                message.entity.forEach(item => {
                    if (item.vehicle && item.vehicle.position) {
                        const lat = item.vehicle.position.latitude;
                        const lon = item.vehicle.position.longitude;
                        const busId = item.vehicle.vehicle.id;

                        L.marker([lat, lon])
                         .addTo(map)
                         .bindPopup("車両ID: " + busId);
                    }
                });
            } catch (err) {
                document.getElementById('output').textContent = 'エラー: ' + err.message;
                console.error(err);
            }
        }

        window.onload = loadBusData;
    </script>
</body>
</html>
